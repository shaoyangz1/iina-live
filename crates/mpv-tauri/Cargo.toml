[package]
name = "mpv-tauri"
version = "0.1.0"
edition = "2021"
description = "Tauri 桌面客户端：播放直播 + B 站番剧"

[lib]
name = "mpv_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mpv-core = { path = "../mpv-core" }
mpv-server = { path = "../mpv-server" }
reqwest = "0.12"
tokio = { version = "1", features = ["full"] }
url = "2"
