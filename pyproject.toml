[project]
name = "play-with-mvp"
version = "0.1.0"
description = "用 IINA/mpv 播放直播与 B 站番剧，直播支持跨 FLV 断流自动续播"
readme = "README.md"
requires-python = "==3.14.*"
# 仅使用 Python 标准库，无第三方依赖
dependencies = []

[project.scripts]
cli = "cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# 根级 cli.py 是唯一对外入口；live / series 是两个内部包。
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["live*", "series*"]
exclude = ["tests*"]
